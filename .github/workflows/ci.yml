name: CI

on:
  push:
    branches: [development, staging, main]
  pull_request:
    branches: [development, staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject tracked secrets and local artifacts
        shell: bash
        run: |
          set -euo pipefail

          blocked_paths="$(git ls-files | grep -E '(^|/)(\.env($|\.)|node_modules/|vendor/|\.wrangler/|runtime/|.*\.sqlite$)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$blocked_paths" ]]; then
            echo "Blocked tracked paths:"
            echo "$blocked_paths"
            exit 1
          fi

          if git grep -I -n -E 'BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY' -- . ':!*.lock'; then
            echo "Private-key material must not be committed."
            exit 1
          fi
      - name: Validate deployment configuration with synthetic environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p runtime
          touch runtime/openrouter.env runtime/chatwoot_bot.env
          docker compose config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          forbidden = {"ADMIN_PASSWORD", "MANAGEMENT_DB_PASSWORD", "MANAGEMENT_DB_ROOT_PASSWORD", "CHATWOOT_POSTGRES_PASSWORD", "APP_KEY", "CLOUDFLARE_IMAGES_API_TOKEN"}
          for name in ("ai", "ai-worker"):
              env = services[name]["environment"]
              assert not forbidden.intersection(env), "AI environment contains unrelated secrets"
              assert {"AI_SERVICE_TOKEN", "AI_QUEUE_REDIS_URL", "OPENROUTER_MODEL"}.issubset(env)
          assert services["management-php"]["environment"]["SEED_ON_START"] == "false"
          print("Compose and AI environment isolation validated")'

  management:
    name: Management
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/management
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Laravel environment
        run: cp .env.example .env
      - uses: shivammathur/setup-php@v2
        with:
          # composer.lock currently resolves Symfony 8.1, which requires PHP >= 8.4.1.
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/management/package-lock.json
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install frontend dependencies
        run: npm ci
      - name: Generate test application key
        run: php artisan key:generate
      - name: Frontend typecheck
        run: npm run typecheck
      - name: Frontend lint
        run: npm run lint
      - name: Frontend build
        run: npm run build
      - name: Backend tests
        run: php artisan test

  ai-service:
    name: AI service
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Syntax check
        run: python -m compileall -q src tests
      - name: Tests
        run: pytest

  document-intake-agent:
    name: Document intake agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/document-intake-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/document-intake-agent/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
